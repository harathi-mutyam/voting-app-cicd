name: Voting App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  vote-ci:
    name: Vote - Python CI
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Install vote dependencies
        working-directory: vote
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages

      - name: Python syntax check
        working-directory: vote
        run: |
          python3 -m compileall .

  result-ci:
    name: Result - Node.js CI
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install dependencies
        working-directory: result
        run: npm ci

  worker-ci:
    name: Worker - Docker Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build worker image
        run: |
          docker build -t voting-worker:ci ./worker

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
  
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jre

      - name: Check Java
        run: java -version

      - name: Install SonarScanner CLI
        run: |
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            curl -sSLo sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.5888-linux-x64.zip
            unzip -q sonar-scanner.zip
            sudo mv sonar-scanner-* /opt/sonar-scanner
            sudo ln -sf /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
          fi

      - name: Check SonarScanner
        run: sonar-scanner --version

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=voting-app-cicd \
            -Dsonar.projectName=voting-app-cicd \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN
            

