name: Voting App CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  vote-ci:
    name: Vote - Python CI
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Install vote dependencies
        working-directory: vote
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages

      - name: Python syntax check
        working-directory: vote
        run: |
          python3 -m compileall .


  result-ci:
    name: Result - Node.js CI
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install dependencies
        working-directory: result
        run: npm ci


  worker-ci:
    name: Worker - Docker Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build worker image
        run: |
          docker build -t voting-worker:ci ./worker


  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  sonarqube:
    name: SonarQube Code Analysis
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Java
        run: |
          echo "Checking Java..."
          java -version

      - name: Check SonarScanner
        run: |
          echo "Checking SonarScanner..."
          which sonar-scanner
          sonar-scanner --version

      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          echo "Checking SonarQube configuration..."

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is EMPTY"
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL is EMPTY"
            exit 1
          fi

          echo "SONAR_TOKEN is available"
          echo "SONAR_HOST_URL is configured"
          echo "SONAR_HOST_URL: $SONAR_HOST_URL"

      - name: Test SonarQube Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          echo "Testing connection to SonarQube..."

          RESPONSE=$(curl -sS \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/authentication/validate")

          echo "SonarQube authentication response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"valid":true'; then
            echo "SonarQube authentication successful"
          else
            echo "ERROR: SonarQube authentication failed"
            exit 1
          fi

      - name: Check SonarQube Server
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          echo "Checking SonarQube server..."
          curl -I "$SONAR_HOST_URL"

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          echo "Starting SonarQube analysis..."

          sonar-scanner \
            -Dsonar.projectKey=voting-app-cicd \
            -Dsonar.projectName=voting-app-cicd \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

          echo "SonarQube analysis completed"
